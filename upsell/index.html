<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentoria ODR - Oferta Especial</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: #1e293b;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 16px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.6;
      margin: 0 0 32px;
    }
    #kiwify-upsell-aVFGDd5 {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #kiwify-upsell-trigger-aVFGDd5 {
      background: var(--kiwify-upsell-accept-bg, #2ECC70);
      color: var(--kiwify-upsell-accept-color, #FFFFFF);
      border: none;
      border-radius: 999px;
      padding: 16px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      max-width: 360px;
    }
    #kiwify-upsell-cancel-trigger-aVFGDd5 {
      color: #94a3b8;
      font-size: 0.9rem;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Antes de continuar...</h1>
    <p>Você tem uma oportunidade única de entrar na Mentoria ODR e acelerar seus resultados.</p>

    <div id="kiwify-upsell-aVFGDd5" data-upsell-url="" data-downsell-url="" style="--kiwify-upsell-accept-bg:#2ECC70;--kiwify-upsell-accept-color:#FFFFFF">
      <button id="kiwify-upsell-trigger-aVFGDd5">Quero entrar na Mentoria ODR</button>
      <div id="kiwify-upsell-cancel-trigger-aVFGDd5">Não, vou avançar sozinho.</div>
    </div>
  </div>

  <script src="https://snippets.kiwify.com/upsell-v2/upsell.min.js"></script>
</body>
</html>
