name: Deploy to GitHub Pages

# A LP é estática: não há build. O workflow só empacota a raiz do
# repositório e publica. Configuração em Settings → Pages → Source:
# "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Empacota o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publica
        id: deployment
        uses: actions/deploy-pages@v4
